<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: 'IBM Plex Sans', system-ui, sans-serif; background: #eef0f3; color: #1a1f27; -webkit-font-smoothing: antialiased; }
  .mono { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }
  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-thumb { background: #c4c9d2; border-radius: 6px; border: 3px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: #a9b0bc; background-clip: padding-box; border: 3px solid transparent; }
  input, select, button { font-family: inherit; }
</style>
</helmet>

<div style="display:flex; height:100vh; width:100%; overflow:hidden;">

  <aside style="width:246px; flex:0 0 246px; background:#111820; display:flex; flex-direction:column; height:100%; border-right:1px solid #0a0f15;">
    <div style="padding:22px 20px 18px; display:flex; align-items:center; gap:11px; border-bottom:1px solid rgba(255,255,255,0.06);">
      <div style="width:34px; height:34px; border-radius:8px; background:#2f6fe0; display:flex; align-items:center; justify-content:center; flex:0 0 34px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4-2 4 2 4-2 4 2v3l-2 1v9H6v-9l-2-1z"/></svg>
      </div>
      <div style="line-height:1.15;">
        <div style="color:#fff; font-weight:600; font-size:14px; letter-spacing:0.2px;">Taller · Pagos</div>
        <div style="color:#6b7688; font-size:11px; letter-spacing:0.3px;">Panel administrativo</div>
      </div>
    </div>

    <nav style="flex:1; overflow-y:auto; padding:12px 0;">
      <div style="padding:6px 20px 8px; color:#5a6473; font-size:10.5px; font-weight:600; letter-spacing:1px; text-transform:uppercase;">General</div>
      <button onClick="{{ go.inicio }}" style="all:unset; box-sizing:border-box; width:100%; cursor:pointer; display:flex; align-items:center; gap:12px; padding:9px 16px; font-size:13.5px; font-weight:500; color:{{ nav.inicio.color }}; background:{{ nav.inicio.bg }}; box-shadow:{{ nav.inicio.bar }};">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v9h14v-9"/></svg><span>Inicio</span>
      </button>
      <button onClick="{{ go.operarios }}" style="all:unset; box-sizing:border-box; width:100%; cursor:pointer; display:flex; align-items:center; gap:12px; padding:9px 16px; font-size:13.5px; font-weight:500; color:{{ nav.operarios.color }}; background:{{ nav.operarios.bg }}; box-shadow:{{ nav.operarios.bar }};">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c0-3 2.5-4.6 5.5-4.6s5.5 1.6 5.5 4.6"/><path d="M16 6.6a3 3 0 0 1 0 5.4"/></svg><span>Operarios</span>
      </button>
      <button onClick="{{ go.modelos }}" style="all:unset; box-sizing:border-box; width:100%; cursor:pointer; display:flex; align-items:center; gap:12px; padding:9px 16px; font-size:13.5px; font-weight:500; color:{{ nav.modelos.color }}; background:{{ nav.modelos.bg }}; box-shadow:{{ nav.modelos.bar }};">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4-8 4-8-4 8-4z"/><path d="M4 12l8 4 8-4"/><path d="M4 16.5l8 4 8-4"/></svg><span>Modelos</span>
      </button>

      <div style="padding:16px 20px 8px; color:#5a6473; font-size:10.5px; font-weight:600; letter-spacing:1px; text-transform:uppercase;">Producción</div>
      <button onClick="{{ go.cortes }}" style="all:unset; box-sizing:border-box; width:100%; cursor:pointer; display:flex; align-items:center; gap:12px; padding:9px 16px; font-size:13.5px; font-weight:500; color:{{ nav.cortes.color }}; background:{{ nav.cortes.bg }}; box-shadow:{{ nav.cortes.bar }};">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="1.6"/><path d="M3.5 9.5h17M9 9.5v10"/></svg><span>Cortes</span>
        <span style="margin-left:auto; font-size:10px; font-weight:600; background:#2f6fe0; color:#fff; padding:1px 6px; border-radius:20px;">central</span>
      </button>
      <button onClick="{{ go.anticipos }}" style="all:unset; box-sizing:border-box; width:100%; cursor:pointer; display:flex; align-items:center; gap:12px; padding:9px 16px; font-size:13.5px; font-weight:500; color:{{ nav.anticipos.color }}; background:{{ nav.anticipos.bg }}; box-shadow:{{ nav.anticipos.bar }};">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.4"/></svg><span>Anticipos</span>
      </button>
      <button onClick="{{ go.liquidacion }}" style="all:unset; box-sizing:border-box; width:100%; cursor:pointer; display:flex; align-items:center; gap:12px; padding:9px 16px; font-size:13.5px; font-weight:500; color:{{ nav.liquidacion.color }}; background:{{ nav.liquidacion.bg }}; box-shadow:{{ nav.liquidacion.bar }};">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 6h10M9.5 12h10M9.5 18h10"/><path d="M4 5.6l1.3 1.3L7.6 4.6M4 11.6l1.3 1.3L7.6 10.6M4 17.6l1.3 1.3L7.6 16.6"/></svg><span>Liquidación</span>
      </button>
      <button onClick="{{ go.rendicion }}" style="all:unset; box-sizing:border-box; width:100%; cursor:pointer; display:flex; align-items:center; gap:12px; padding:9px 16px; font-size:13.5px; font-weight:500; color:{{ nav.rendicion.color }}; background:{{ nav.rendicion.bg }}; box-shadow:{{ nav.rendicion.bar }};">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12.5h6M9 16h6"/></svg><span>Rendición de cuentas</span>
      </button>

      <div style="padding:16px 20px 8px; color:#5a6473; font-size:10.5px; font-weight:600; letter-spacing:1px; text-transform:uppercase;">Sistema</div>
      <button onClick="{{ go.config }}" style="all:unset; box-sizing:border-box; width:100%; cursor:pointer; display:flex; align-items:center; gap:12px; padding:9px 16px; font-size:13.5px; font-weight:500; color:{{ nav.config.color }}; background:{{ nav.config.bg }}; box-shadow:{{ nav.config.bar }};">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M5 12h14M5 17h14"/><circle cx="9" cy="7" r="2.1" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="2.1" fill="currentColor" stroke="none"/><circle cx="8" cy="17" r="2.1" fill="currentColor" stroke="none"/></svg><span>Configuración</span>
      </button>
    </nav>

    <div style="padding:14px 16px; border-top:1px solid rgba(255,255,255,0.06); display:flex; align-items:center; gap:11px;">
      <div style="width:32px; height:32px; border-radius:50%; background:#2a3644; color:#cdd6e2; display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:600; flex:0 0 32px;">DT</div>
      <div style="line-height:1.2; overflow:hidden;">
        <div style="color:#e5e9ef; font-size:12.5px; font-weight:500;">Dueño del taller</div>
        <div style="color:#6b7688; font-size:11px;">Administrador</div>
      </div>
    </div>
  </aside>

  <main style="flex:1; height:100%; overflow-y:auto; background:#eef0f3;">
    <sc-if value="{{ isCortes }}" hint-placeholder-val="{{ true }}">
      <div data-screen-label="Cortes · Detalle de corte">{{ corteView }}</div>
    </sc-if>
    <sc-if value="{{ isInicio }}"><div data-screen-label="Inicio">{{ inicioView }}</div></sc-if>
    <sc-if value="{{ isOperarios }}"><div data-screen-label="Operarios">{{ operariosView }}</div></sc-if>
    <sc-if value="{{ isModelos }}"><div data-screen-label="Modelos">{{ modelosView }}</div></sc-if>
    <sc-if value="{{ isAnticipos }}"><div data-screen-label="Anticipos">{{ anticiposView }}</div></sc-if>
    <sc-if value="{{ isLiquidacion }}"><div data-screen-label="Liquidación">{{ liquidacionView }}</div></sc-if>
    <sc-if value="{{ isRendicion }}"><div data-screen-label="Rendición">{{ rendicionView }}</div></sc-if>
    <sc-if value="{{ isConfig }}"><div data-screen-label="Configuración">{{ configView }}</div></sc-if>
  </main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:820}}">
class Component extends DCLogic {
  CANTIDAD = 372;
  MODELO = 'black DOBLE PRET 06';
  VERSION = 'v1';
  OVERRIDE_DEF = 0.10;
  MOxPrenda = 8.10;

  A = '#2f6fe0';

  operarios = [
    { id:'ruben', nombre:'RUBEN', tipo:'regular' },
    { id:'claris', nombre:'CLARIS', tipo:'regular' },
    { id:'mario', nombre:'MARIO', tipo:'regular' },
    { id:'alex', nombre:'ALEX', tipo:'regular' },
    { id:'teo', nombre:'TEO', tipo:'regular' },
    { id:'rosa', nombre:'ROSA', tipo:'regular' },
    { id:'jose', nombre:'JOSE', tipo:'maestro' },
  ];

  gruposOrden = ['TRASEROS','DELANTEROS','ENSAMBLE','CERADO','ACABADO','PRESILLA','PARCHE'];

  ops = [
    { id:'TRA1', g:'TRASEROS', n:'1', eq:'recta', pr:'pinza', pz:'trasero', ct:0.15 },
    { id:'TRA2', g:'TRASEROS', n:'2', eq:'recta', pr:'urlado', pz:'bolsillo', ct:0.20 },
    { id:'TRA3', g:'TRASEROS', n:'3', eq:'recta', pr:'parchado', pz:'bolsillo', ct:0.50 },
    { id:'TRA4', g:'TRASEROS', n:'4', eq:'recta', pr:'despunte', pz:'bolsillo', ct:0.20 },
    { id:'DEL1', g:'DELANTEROS', n:'1', eq:'recta', pr:'boca', pz:'delantero', ct:0.30 },
    { id:'DEL2', g:'DELANTEROS', n:'2', eq:'plancha', pr:'planchado', pz:'aleta', ct:0.15 },
    { id:'DEL3', g:'DELANTEROS', n:'3', eq:'plana', pr:'ensamble', pz:'delantero', ct:0.50 },
    { id:'DEL4', g:'DELANTEROS', n:'4', eq:'recta', pr:'despunte', pz:'vista', ct:0.20 },
    { id:'DEL5', g:'DELANTEROS', n:'5', eq:'recta', pr:'herraje', pz:'aleta', ct:0.25 },
    { id:'ENS1', g:'ENSAMBLE', n:'1', eq:'over', pr:'ensamble', pz:'lateral', ct:0.40 },
    { id:'ENS2', g:'ENSAMBLE', n:'2', eq:'over', pr:'ensamble', pz:'entrepierna', ct:0.40 },
    { id:'ENS3', g:'ENSAMBLE', n:'3', eq:'over', pr:'safado', pz:'cuerpo', ct:0.25 },
    { id:'ENS4', g:'ENSAMBLE', n:'4', eq:'plana', pr:'pegado', pz:'pretina', ct:0.80 },
    { id:'CER1', g:'CERADO', n:'1', eq:'cerradora', pr:'cerrado', pz:'lateral', ct:0.55 },
    { id:'CER2', g:'CERADO', n:'2', eq:'cerradora', pr:'cerrado', pz:'entrepierna', ct:0.55 },
    { id:'ACA1', g:'ACABADO', n:'1', eq:'atracadora', pr:'atraque', pz:'presilla', ct:0.30 },
    { id:'ACA2', g:'ACABADO', n:'2', eq:'collareta', pr:'boca', pz:'bocamanga', ct:0.25 },
    { id:'ACA3', g:'ACABADO', n:'3', eq:'overlock', pr:'overeado', pz:'prenda', ct:0.30 },
    { id:'ACA4', g:'ACABADO', n:'4', eq:'plancha', pr:'planchado', pz:'prenda', ct:0.40 },
    { id:'PRE1', g:'PRESILLA', n:'1', eq:'recta', pr:'presilla', pz:'pretina', ct:0.30 },
    { id:'PRE2', g:'PRESILLA', n:'2', eq:'recta', pr:'pasador', pz:'presilla', ct:0.20 },
    { id:'PAR1', g:'PARCHE', n:'1', eq:'recta', pr:'parchado', pz:'parche', ct:0.65 },
    { id:'PAR2', g:'PARCHE', n:'2', eq:'codo', pr:'despunte', pz:'parche', ct:0.30 },
  ];

  state = {
    view: 'cortes',
    estado: 'Abierto',
    rendOperario: 'ruben',
    expanded: { TRASEROS: true, ENSAMBLE: true },
    assignments: {
      TRA1: [ { operarioId:'ruben', cantidad:372, maestro:false, override:0.10 } ],
      TRA2: [ { operarioId:'claris', cantidad:372, maestro:false, override:0.10 } ],
      TRA3: [ { operarioId:'ruben', cantidad:200, maestro:false, override:0.10 }, { operarioId:'claris', cantidad:172, maestro:false, override:0.10 } ],
      TRA4: [ { operarioId:'mario', cantidad:372, maestro:false, override:0.10 } ],
      DEL1: [ { operarioId:'ruben', cantidad:372, maestro:false, override:0.10 } ],
      DEL2: [ { operarioId:'ruben', cantidad:372, maestro:false, override:0.10 } ],
      DEL3: [ { operarioId:'ruben', cantidad:372, maestro:false, override:0.10 } ],
      DEL4: [ { operarioId:'ruben', cantidad:372, maestro:false, override:0.10 } ],
      DEL5: [ { operarioId:'ruben', cantidad:372, maestro:false, override:0.10 } ],
      ENS1: [ { operarioId:'alex', cantidad:300, maestro:false, override:0.10 } ],
      ENS2: [ { operarioId:'alex', cantidad:372, maestro:false, override:0.10 } ],
      ENS3: [ { operarioId:'teo', cantidad:372, maestro:false, override:0.10 } ],
      ENS4: [ { operarioId:'mario', cantidad:272, maestro:false, override:0.10 }, { operarioId:'jose', cantidad:100, maestro:true, override:0.10 } ],
      ACA1: [ { operarioId:'teo', cantidad:372, maestro:false, override:0.10 } ],
      ACA3: [ { operarioId:'rosa', cantidad:372, maestro:false, override:0.10 } ],
      PAR1: [ { operarioId:'mario', cantidad:372, maestro:false, override:0.10 } ],
      PAR2: [ { operarioId:'mario', cantidad:372, maestro:false, override:0.10 } ],
    },
  };

  fmt(n){ return (Math.round((Number(n)||0)*100)/100).toFixed(2); }
  nombreOf(id){ const o = this.operarios.find(x=>x.id===id); return o ? o.nombre : ''; }

  updateField(opId, idx, field, val){
    this.setState(s => {
      const a = { ...s.assignments };
      const list = (a[opId]||[]).map(x=>({...x}));
      if (list[idx]) list[idx][field] = val;
      a[opId] = list;
      return { assignments: a };
    });
  }
  toggleMaestro(opId, idx){
    this.setState(s => {
      const a = { ...s.assignments };
      const list = (a[opId]||[]).map(x=>({...x}));
      if (list[idx]) list[idx].maestro = !list[idx].maestro;
      a[opId] = list;
      return { assignments: a };
    });
  }
  addAssignment(opId){
    this.setState(s => {
      const a = { ...s.assignments };
      const list = (a[opId]||[]).map(x=>({...x}));
      if (list.length < 3) list.push({ operarioId:'', cantidad:0, maestro:false, override:0.10 });
      a[opId] = list;
      return { assignments: a };
    });
  }
  removeAssignment(opId, idx){
    this.setState(s => {
      const a = { ...s.assignments };
      const list = (a[opId]||[]).map(x=>({...x}));
      list.splice(idx,1);
      a[opId] = list;
      return { assignments: a };
    });
  }
  assignWhole(grupo, operarioId){
    if (!operarioId) return;
    this.setState(s => {
      const a = { ...s.assignments };
      this.ops.filter(o=>o.g===grupo).forEach(o=>{
        a[o.id] = [ { operarioId, cantidad: this.CANTIDAD, maestro:false, override:0.10 } ];
      });
      return { assignments: a };
    });
  }
  toggleGroup(grupo){
    this.setState(s => ({ expanded: { ...s.expanded, [grupo]: !s.expanded[grupo] } }));
  }
  closeCorte(){ this.setState({ estado: 'Cerrado' }); }

  computeOp(op){
    const list = this.state.assignments[op.id] || [];
    let assigned = 0, pago = 0;
    const assignments = list.map((a, idx) => {
      const qty = Number(a.cantidad) || 0;
      const ov = a.maestro ? (Number(a.override)||0) : 0;
      const eff = op.ct + ov;
      const p = qty * eff;
      assigned += qty; pago += p;
      return {
        idx, operarioId: a.operarioId, cantidad: a.cantidad, maestro: a.maestro,
        override: a.override, overrideFmt: this.fmt(a.override),
        nombre: this.nombreOf(a.operarioId) || '—',
        tarifaEffFmt: this.fmt(eff), pagoFmt: this.fmt(p),
        maestroBg: a.maestro ? 'rgba(47,111,224,0.1)' : '#fff',
        maestroBorder: a.maestro ? '#2f6fe0' : '#d7dbe2',
        maestroColor: a.maestro ? '#2f6fe0' : '#98a0ac',
        onOperario: (e)=>this.updateField(op.id, idx, 'operarioId', e.target.value),
        onCantidad: (e)=>this.updateField(op.id, idx, 'cantidad', e.target.value),
        onOverride: (e)=>this.updateField(op.id, idx, 'override', e.target.value),
        onToggleMaestro: ()=>this.toggleMaestro(op.id, idx),
        onRemove: ()=>this.removeAssignment(op.id, idx),
      };
    });
    const diff = this.CANTIDAD - assigned;
    let state = assigned===0 ? 'none' : (diff===0 ? 'ok' : 'partial');
    let stateColor, stateBg, stateBorder, stateLabel;
    if (state==='ok'){ stateColor='#127a45'; stateBg='#e6f4ec'; stateBorder='#bfe3cd'; stateLabel='Cuadra · '+assigned; }
    else if (state==='none'){ stateColor='#7c8492'; stateBg='#eef0f3'; stateBorder='#dde1e7'; stateLabel='Sin asignar'; }
    else { stateColor='#c0362c'; stateBg='#fbeceb'; stateBorder='#f2c9c5'; stateLabel = diff>0 ? ('Faltan '+diff) : ('Sobran '+(-diff)); }
    return {
      id: op.id, n: op.n, eq: op.eq, pr: op.pr, pz: op.pz,
      ctFmt: this.fmt(op.ct),
      assigned, assignedFmt: String(assigned),
      canAdd: assignments.length < 3,
      onAdd: ()=>this.addAssignment(op.id),
      pagoOpFmt: this.fmt(pago),
      state, stateColor, stateBg, stateBorder, stateLabel,
      rowBg: state==='partial' ? '#fffafa' : '#fff',
      assignments,
    };
  }

  renderVals(){
    const A = this.A;
    const keys = ['inicio','operarios','modelos','cortes','anticipos','liquidacion','rendicion','config'];
    const nav = {}; const go = {};
    keys.forEach(k => {
      const active = this.state.view === k;
      nav[k] = {
        color: active ? '#eef4ff' : '#98a2b3',
        bg: active ? 'rgba(47,111,224,0.14)' : 'transparent',
        bar: active ? 'inset 3px 0 0 #2f6fe0' : 'none',
      };
      go[k] = () => this.setState({ view: k });
    });

    const grupos = this.gruposOrden.map(gname => {
      const gops = this.ops.filter(o=>o.g===gname).map(o=>this.computeOp(o));
      const ct = this.ops.filter(o=>o.g===gname).reduce((a,o)=>a+o.ct,0);
      const okCount = gops.filter(o=>o.state==='ok').length;
      const noneCount = gops.filter(o=>o.state==='none').length;
      const partialCount = gops.filter(o=>o.state==='partial').length;
      let gState, gColor, gBg, gBorder, gLabel;
      if (okCount===gops.length){ gState='ok'; gColor='#127a45'; gBg='#e6f4ec'; gBorder='#bfe3cd'; gLabel='Completo'; }
      else if (noneCount===gops.length){ gState='none'; gColor='#7c8492'; gBg='#eef0f3'; gBorder='#dde1e7'; gLabel='Pendiente'; }
      else if (partialCount>0){ gState='partial'; gColor='#c0362c'; gBg='#fbeceb'; gBorder='#f2c9c5'; gLabel='Con descuadre'; }
      else { gState='mixed'; gColor='#9a6a12'; gBg='#fbf3e3'; gBorder='#eeddb8'; gLabel='En progreso'; }
      const expanded = !!this.state.expanded[gname];
      return {
        nombre: gname, ct: this.fmt(ct), okCount, total: gops.length,
        progreso: okCount + '/' + gops.length,
        gState, gColor, gBg, gBorder, gLabel,
        expanded, bodyDisplay: expanded ? 'block' : 'none',
        chevron: expanded ? 'rotate(90deg)' : 'rotate(0deg)',
        onToggle: ()=>this.toggleGroup(gname),
        onAssignWhole: (e)=>{ this.assignWhole(gname, e.target.value); e.target.value=''; },
        ops: gops,
      };
    });

    const allOps = this.ops.map(o=>this.computeOp(o));
    const okTotal = allOps.filter(o=>o.state==='ok').length;
    const partialTotal = allOps.filter(o=>o.state==='partial').length;
    const noneTotal = allOps.filter(o=>o.state==='none').length;

    // Ganancia por operario dentro del corte
    const acc = {};
    this.ops.forEach(op => {
      (this.state.assignments[op.id]||[]).forEach(a => {
        if (!a.operarioId) return;
        const qty = Number(a.cantidad)||0;
        const eff = op.ct + (a.maestro ? (Number(a.override)||0) : 0);
        if (!acc[a.operarioId]) acc[a.operarioId] = { qty:0, pago:0, maestro:false };

      h('div', { className:'mono', style:{ fontSize:'24px', fontWeight:700, color:color||'#1a1f27', marginTop:'6px', whiteSpace:'nowrap' } }, (prefix||'')+val, h('span',{style:{fontSize:'13px',color:'#9aa0ab',fontWeight:500}},' Bs')));

    const th = (t, align)=>h('th', { style:{ textAlign:align||'left', padding:'10px 16px', fontSize:'11px', color:'#8b93a1', fontWeight:600, textTransform:'uppercase', letterSpacing:'.4px', borderBottom:'1px solid #e2e5ea' } }, t);
    const detalle = h('div', { style:{ ...card, overflow:'hidden' } },
      h('div', { style:{ padding:'14px 18px', borderBottom:'1px solid #eef0f3', display:'flex', alignItems:'center', gap:'10px' } },
        h('span', { style:{ fontSize:'14px', fontWeight:600 } }, 'Trabajo de '+r.selNombre),
        r.esMaestro?h('span',{style:{fontSize:'10px',fontWeight:700,color:A,border:'1px solid '+A,borderRadius:'4px',padding:'0 5px'}},'MAESTRO EXTERNO'):null,
        h('span', { style:{ marginLeft:'auto', fontSize:'12px', color:'#8b93a1' } }, 'Corte #C-0142 · black DOBLE PRET 06 v1')),
      r.hasFilas ? h('table', { style:{ width:'100%', borderCollapse:'collapse' } },
        h('thead', null, h('tr', null, th('Grupo'), th('Proceso'), th('Pieza'), th('Tarifa','right'), th('Piezas','right'), th('Ganado','right'))),
        h('tbody', null, r.filas.map((f,i)=>h('tr', { key:i },
          h('td',{style:{padding:'11px 16px',borderBottom:'1px solid #f1f3f6'}}, h('span',{style:{fontSize:'11px',fontWeight:600,color:'#6b7280',letterSpacing:'.3px'}},f.g)),
          h('td',{style:{padding:'11px 16px',borderBottom:'1px solid #f1f3f6',fontSize:'13px',fontWeight:500}}, f.pr, f.maestro?h('span',{style:{marginLeft:'6px',fontSize:'10px',color:A,fontWeight:700}},'+0.10'):null),
          h('td',{style:{padding:'11px 16px',borderBottom:'1px solid #f1f3f6',fontSize:'13px',color:'#6b7280'}}, f.pz),
          h('td',{style:{padding:'11px 16px',borderBottom:'1px solid #f1f3f6',textAlign:'right'}}, h('span',{className:'mono',style:{fontSize:'12.5px'}},f.eff)),
          h('td',{style:{padding:'11px 16px',borderBottom:'1px solid #f1f3f6',textAlign:'right'}}, h('span',{className:'mono',style:{fontSize:'12.5px'}},f.qty)),
          h('td',{style:{padding:'11px 16px',borderBottom:'1px solid #f1f3f6',textAlign:'right'}}, h('span',{className:'mono',style:{fontSize:'13px',fontWeight:600}},f.pago))
        )))
      ) : h('div', { style:{ padding:'40px', textAlign:'center', color:'#9aa0ab', fontSize:'13px' } }, r.selNombre+' no tiene asignaciones en este corte.'));

    return h('div', null, head,
      h('div', { style:{ padding:'22px 30px 40px', display:'flex', flexDirection:'column', gap:'16px' } },
        h('div', { style:{ display:'flex', gap:'14px' } },
          bignum('Total ganado', r.ganado, '#1a1f27'),
          bignum('Anticipos', r.ant, '#6b7280', '− '),
          bignum('Saldo', r.saldo, r.saldoColor)),
        detalle,
        h('div', { style:{ fontSize:'11.5px', color:'#9aa0ab', textAlign:'center' } }, 'Esta vista muestra únicamente los datos de '+r.selNombre+'. Ningún dato de otros operarios es visible.')
      ));
  }

  buildConfig(){
    const h = React.createElement; const A = this.A;
    const card = { background:'#fff', border:'1px solid #e2e5ea', borderRadius:'10px' };
    const head = this.pageHead('Configuración', 'Parámetros del sistema de pagos');
    const row = (title, desc, control)=>h('div', { style:{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:'20px', padding:'16px 20px', borderTop:'1px solid #f1f3f6' } },
      h('div', null, h('div',{style:{fontSize:'13.5px',fontWeight:600}},title), h('div',{style:{fontSize:'12px',color:'#8b93a1',marginTop:'3px',maxWidth:'420px',lineHeight:1.45}},desc)), control);
    const inp = (val, unit)=>h('div',{style:{display:'flex',alignItems:'center',gap:'8px'}}, h('input',{defaultValue:val,style:{width:'90px',fontSize:'13.5px',padding:'8px 10px',borderRadius:'8px',border:'1px solid #d7dbe2',textAlign:'right',fontFamily:"'IBM Plex Mono', monospace"}}), h('span',{style:{fontSize:'12.5px',color:'#8b93a1'}},unit));
    const sec = (t, rows)=>h('div', { style:{ ...card, overflow:'hidden' } },
      h('div', { style:{ padding:'14px 20px', fontSize:'14px', fontWeight:600 } }, t), rows);
    return h('div', null, head,
      h('div', { style:{ padding:'22px 30px 40px', display:'flex', flexDirection:'column', gap:'16px', maxWidth:'720px' } },
        sec('Reglas de pago', h('div',null,
          row('Tope de anticipo', 'Monto de referencia. Si un anticipo lo supera, el sistema muestra una advertencia — no bloquea el registro.', inp('500.00','Bs')),
          row('Diferencial de maestro externo', 'Se suma a la tarifa base por pieza cuando una asignación se marca como maestro externo. Editable por asignación.', inp('0.10','Bs / pieza')))),
        sec('Datos del taller', h('div',null,
          row('Nombre del taller', 'Aparece en las planillas impresas.', h('input',{defaultValue:'Taller de Confección',style:{width:'220px',fontSize:'13.5px',padding:'8px 10px',borderRadius:'8px',border:'1px solid #d7dbe2'}})),
          row('Moneda', 'Toda la operación es en Bolivianos.', h('span',{style:{fontSize:'13px',fontWeight:600,color:'#6b7280'}},'Bs · Boliviano')))),
        sec('Usuarios y roles', h('div',null,
          row('Rol operario y app móvil', 'Preparado para Fase 2: cada operario verá solo sus propios datos desde su celular, sobre el mismo backend.', h('span',{style:{fontSize:'11px',fontWeight:600,color:'#9a6a12',background:'#fbf3e3',border:'1px solid #eeddb8',padding:'3px 10px',borderRadius:'20px'}},'Fase 2'))))
      ));
  }
}
</script>
