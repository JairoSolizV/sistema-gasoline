server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: cualquier ruta desconocida sirve index.html (React Router)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html NUNCA se guarda sin revalidar: apunta a los .js/.css de la
  # versión vigente. Si el navegador se quedara con uno viejo después de una
  # actualización, cargaría el código anterior contra la API nueva y fallaría.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Vite pone un hash en el nombre de cada archivo de /assets: cambia en cada
  # versión, así que se pueden cachear para siempre.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # el panel llama a /api → se proxya a la API del compose
  location /api/ {
    proxy_pass http://server:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
